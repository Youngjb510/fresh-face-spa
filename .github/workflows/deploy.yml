name: Deploy to GitHub Pages

# GitHub Pages is a static host. This workflow builds the site as static,
# pre-rendered HTML/CSS/JS + gallery images and publishes it to the gh-pages
# branch. The repo must have GitHub Pages enabled with Source set to one of:
#   * "Deploy from a branch" and the branch set to `gh-pages` / (root), or
#   * "GitHub Actions" (see GITHUB_PAGES.md).
# No extra secrets are needed — the GITHUB_TOKEN that Actions already has write
# access with is used to push the gh-pages branch.

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Only one deployment at a time; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

# Token with permission to push the gh-pages branch (used by peaceiris action).
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build static site (base path /fresh-face-spa/)
        # Produces the deployable static bundle in dist/client:
        # pre-rendered index.html + hashed JS/CSS + all gallery images.
        run: bash ./scripts/build-gh-pages.sh

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/client
          publish_branch: gh-pages
          force_orphan: true
